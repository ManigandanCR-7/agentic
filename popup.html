<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Voice Gemini</title>

    <style>

        body {

            width: 280px;

            padding: 20px;

            font-family: Arial;

            background: #111827;

            color: white;

        }

        h2 {

            margin-top: 0;

        }

        .key {

            background: #1f2937;

            padding: 12px;

            border-radius: 10px;

            margin-top: 10px;

        }

        b {

            color: #00d9ff;

        }

    </style>

</head>


<body>

    <h2>🎤 Voice Gemini</h2>

    <div class="key">

        Press <b>C</b><br>
        Enable microphone cursor

    </div>

    <div class="key">

        Press <b>W</b><br>
        Start / stop recording

    </div>

    <div class="key">

        Press <b>ENTER</b><br>
        Submit voice query

    </div>

    <div class="key">

        ⏱️ Maximum recording:<br>
        <b>30 seconds</b>

    </div>

</body>

</html>
